# Build & publish the "Releases" release
name: "Release Mods"

on:
  push:
    branches:
      - main
    paths:
      - "**/*.sdkmod"
  workflow_dispatch:

# Never let two runs delete/recreate the release at the same time
concurrency:
  group: release-mods
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: "Releases"
  RELEASE_NAME: "Ongo's Borderlands 1 Mods"

jobs:
  release:
    name: "Release Mods"
    # Only proceed if this is the official repository (not a fork)
    if: ${{ github.repository_owner == 'OngoGablogian' }}
    runs-on: ubuntu-latest
    steps:
      # CHECKOUT REPOSITORY
      - name: "Checkout repository"
        uses: actions/checkout@v6

      # ZIP EACH MOD + WRITE RELEASE NOTES
      # Name and version come from the pyproject.toml inside each .sdkmod
      # (falls back to the loose <ModFolder>/<Mod>/pyproject.toml).
      - name: "Package mods and build release notes"
        shell: python
        run: |
          import os, sys, tomllib, zipfile
          from pathlib import Path

          root = Path(".").resolve()
          out_dir = root / "dist"
          out_dir.mkdir(exist_ok=True)

          def read_meta(data: dict) -> tuple[str | None, str | None]:
              sdk = data.get("tool", {}).get("sdkmod", {})
              proj = data.get("project", {})
              return sdk.get("name") or proj.get("name"), sdk.get("version") or proj.get("version")

          mods = []
          for sdkmod in sorted(root.rglob("*.sdkmod")):
              if ".git" in sdkmod.parts or "dist" in sdkmod.parts:
                  continue
              stem = sdkmod.stem
              name = version = None

              # 1) pyproject.toml inside the .sdkmod (it's just a zip)
              try:
                  with zipfile.ZipFile(sdkmod) as z:
                      inner = next((n for n in z.namelist()
                                    if n.replace("\\", "/").endswith("pyproject.toml")
                                    and n.replace("\\", "/").count("/") <= 1), None)
                      if inner:
                          name, version = read_meta(tomllib.loads(z.read(inner).decode("utf-8")))
              except (zipfile.BadZipFile, tomllib.TOMLDecodeError) as e:
                  print(f"::warning file={sdkmod.relative_to(root)}::Could not read pyproject.toml inside .sdkmod: {e}")

              # 2) loose pyproject.toml next to it
              loose = sdkmod.parent / stem / "pyproject.toml"
              if loose.is_file():
                  l_name, l_version = read_meta(tomllib.loads(loose.read_text(encoding="utf-8")))
                  if version and l_version and version != l_version:
                      print(f"::warning file={loose.relative_to(root)}::Version mismatch for {stem}: "
                            f".sdkmod has {version}, loose pyproject.toml has {l_version}. Using {version}.")
                  name = name or l_name
                  version = version or l_version

              if not name:
                  name = stem
              if not version:
                  print(f"::error file={sdkmod.relative_to(root)}::No version found for {stem}")
                  sys.exit(1)

              version = version.lstrip("vV")
              asset = f"{'.'.join(name.split())}.v{version}.zip"
              # Deterministic zip (fixed timestamp, stored): an unchanged .sdkmod always
              # produces a byte-identical zip, so unchanged mods are not re-uploaded.
              info = zipfile.ZipInfo(sdkmod.name, date_time=(1980, 1, 1, 0, 0, 0))
              info.compress_type = zipfile.ZIP_STORED  # .sdkmod is already compressed
              info.external_attr = 0o644 << 16
              with zipfile.ZipFile(out_dir / asset, "w") as z:
                  z.writestr(info, sdkmod.read_bytes())

              mods.append((name, version, asset))
              print(f"Packaged {sdkmod.relative_to(root)} -> dist/{asset}")

          if not mods:
              print("::error::No .sdkmod files found")
              sys.exit(1)

          mods.sort(key=lambda m: m[0].casefold())
          mod_lines = "\n".join(f"- {n} [v{v}]" for n, v, _ in mods)

          notes = f"""## Mods

          {mod_lines}

          ## Installation

          1. Download the zipped `.sdkmod` files from the releases page.
          2. Extract the `.sdkmod` files , and copy them into your `sdk_mods` folder, inside your Borderlands install's `Binaries` folder.
          3. Start the game, open **Mods** from the main menu (or pause menu) and enable the mods.
          """
          (root / "release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)

      # MOVE THE RELEASE TAG TO THIS COMMIT (the release itself is kept)
      - name: "Advance release tag to this commit"
        run: |
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

      # UPDATE (OR CREATE) THE RELEASE
      # - New/changed zips are uploaded; unchanged zips are left alone so their
      #   download counts are kept.
      # - Zips no longer produced (old versions, removed mods) are deleted.
      - name: "Update release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No existing release; creating it."
            gh release create "$RELEASE_TAG" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md \
              --latest
            exit 0
          fi

          # Existing assets: id <TAB> name <TAB> digest <TAB> size
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | [.id, .name, (.digest // ""), .size] | @tsv' > remote-assets.tsv

          # Upload new or changed zips
          for zip in dist/*.zip; do
            name=$(basename "$zip")
            local_digest="sha256:$(sha256sum "$zip" | cut -d' ' -f1)"
            local_size=$(stat -c %s "$zip")
            row=$(awk -F'\t' -v n="$name" '$2 == n' remote-assets.tsv)

            if [ -z "$row" ]; then
              echo "New:       $name"
              gh release upload "$RELEASE_TAG" "$zip" --repo "$GITHUB_REPOSITORY"
              continue
            fi

            remote_digest=$(cut -f3 <<< "$row")
            remote_size=$(cut -f4 <<< "$row")
            if { [ -n "$remote_digest" ] && [ "$remote_digest" != "$local_digest" ]; } ||
               { [ -z "$remote_digest" ] && [ "$remote_size" != "$local_size" ]; }; then
              echo "Changed:   $name (same version, re-uploading)"
              gh release upload "$RELEASE_TAG" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "Unchanged: $name"
            fi
          done

          # Delete assets that are no longer produced
          while IFS=$'\t' read -r id name _ _; do
            if [ ! -f "dist/$name" ]; then
              echo "Removing:  $name"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done < remote-assets.tsv

          # Refresh title/notes and make sure it's marked Latest
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --draft=false \
            --prerelease=false \
            --latest
